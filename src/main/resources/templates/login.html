<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập quản trị</title>
    <link rel="stylesheet" th:href="@{/css/web-login.css}">
</head>
<body>
<main class="login-card">
    <h1>Đăng nhập quản trị</h1>
    <p>Sử dụng tài khoản Moderator hoặc Administrator.</p>
    <div class="alert error" role="alert" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div>
    <div class="alert success" role="status" th:if="${param.logout}">Bạn đã đăng xuất.</div>
    <form method="post" th:action="@{/login}">
        <label for="username">Email</label>
        <input id="username" name="username" type="email" autocomplete="username" required autofocus>
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Đăng nhập</button>
    </form>
</main>
</body>
</html>
