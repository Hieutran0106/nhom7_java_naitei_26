<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Chi tiết người dùng - ' + ${user.name}">Chi tiết người dùng</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
        body { margin: 0; }
        main { width: min(920px, calc(100% - 32px)); margin: 40px auto; }
        a { color: #2563eb; text-decoration: none; }
        .card { margin-top: 20px; padding: 28px; border: 1px solid #e5e7eb; border-radius: 12px; background: white; box-shadow: 0 4px 16px rgba(0,0,0,.05); }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 32px; }
        .label { display: block; margin-bottom: 6px; color: #6b7280; font-size: 13px; }
        .value { font-weight: 600; overflow-wrap: anywhere; }
        .roles { display: flex; flex-wrap: wrap; gap: 8px; }
        .badge { padding: 5px 10px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-size: 13px; font-weight: 700; }
        .role-panel { margin-top: 28px; padding-top: 24px; border-top: 1px solid #e5e7eb; }
        form { display: flex; align-items: end; gap: 12px; }
        select, button { min-height: 42px; border-radius: 8px; font: inherit; }
        select { min-width: 220px; padding: 0 12px; border: 1px solid #d1d5db; background: white; }
        button { padding: 0 18px; border: 0; background: #2563eb; color: white; cursor: pointer; font-weight: 700; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .alert { margin-top: 16px; padding: 12px 16px; border-radius: 8px; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } form { align-items: stretch; flex-direction: column; } select { width: 100%; } }
    </style>
</head>
<body>
<main>
    <a th:href="@{/moderator/users}">&larr; Quay lại danh sách người dùng</a>
    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="card">
        <h1 th:text="${user.name}">Tên người dùng</h1>
        <div class="grid">
            <div><span class="label">ID</span><span class="value" th:text="${user.id}">1</span></div>
            <div><span class="label">Email</span><span class="value" th:text="${user.email}">email@example.com</span></div>
            <div><span class="label">Số điện thoại</span><span class="value" th:text="${user.phone ?: 'Chưa cập nhật'}">Chưa cập nhật</span></div>
            <div><span class="label">Trạng thái</span><span class="value" th:text="${user.status}">ACTIVE</span></div>
            <div><span class="label">Xác minh danh tính</span><span class="value" th:text="${user.isIdentityVerified == true ? 'Đã xác minh' : 'Chưa xác minh'}">Chưa xác minh</span></div>
            <div><span class="label">Xác minh doanh nghiệp</span><span class="value" th:text="${user.isBusinessVerified == true ? 'Đã xác minh' : 'Chưa xác minh'}">Chưa xác minh</span></div>
            <div>
                <span class="label">Vai trò hiện tại</span>
                <div class="roles">
                    <span class="badge" th:each="currentRole : ${user.roles}" th:text="${currentRole}">USER</span>
                </div>
            </div>
        </div>

        <div class="role-panel" sec:authorize="hasRole('ADMIN')">
            <h2>Thêm vai trò</h2>
            <p>Chọn một vai trò chưa được gán cho người dùng này.</p>
            <form method="post" th:action="@{/moderator/users/{id}/role(id=${user.id})}">
                <label>
                    <span class="label">Vai trò mới</span>
                    <select name="role" required>
                        <option value="" selected disabled>Chọn vai trò</option>
                        <option th:each="role : ${availableRoles}"
                                th:unless="${user.roles.contains(role)}"
                                th:value="${role}"
                                th:text="${role}">MODERATOR</option>
                    </select>
                </label>
                <button type="submit">Cập nhật vai trò</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
