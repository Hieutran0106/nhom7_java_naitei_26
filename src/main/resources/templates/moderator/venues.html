<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/moderator-layout :: layout(
          'Quản lý Venue',
          'venues',
          ~{::section}
      )}">

<section class="venue-page">

    <link rel="stylesheet"
          th:href="@{/css/moderator-venues.css}">

    <div class="page-header">

        <div>
            <p class="page-description">
                Xem thông tin, duyệt venue đang chờ và khóa venue vi phạm.
            </p>
        </div>

        <span class="venue-total"
              th:text="${venues.totalElements} + ' venue'">
            0 venue
        </span>

    </div>


    <div th:if="${successMessage}"
         class="alert alert-success"
         role="status"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-error"
         role="alert"
         th:text="${errorMessage}">
    </div>


    <div class="content-card">

        <form class="venue-filters"
              method="get"
              th:action="@{/moderator/venues}">

            <div class="venue-filter-group">

                <label for="status">
                    Trạng thái
                </label>

                <select id="status"
                        name="status">

                    <option value="">
                        Tất cả
                    </option>

                    <option th:each="item : ${statuses}"
                            th:value="${item}"
                            th:text="${item}"
                            th:selected="${item == selectedStatus}">
                        PENDING
                    </option>

                </select>

            </div>

            <input type="hidden"
                   name="size"
                   th:value="${venues.pageSize}">

            <div class="venue-filter-action">

                <button class="venue-filter-button"
                        type="submit">
                    Lọc danh sách
                </button>

            </div>

        </form>


        <div class="venue-table-wrap"
             th:if="${!venues.content.isEmpty()}">

            <table class="venue-table">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Venue</th>
                    <th>Chủ sở hữu</th>
                    <th>Địa chỉ</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="venue : ${venues.content}">

                    <td th:text="${venue.id}">
                        1
                    </td>

                    <td>

                        <strong th:text="${venue.name}">
                            Innovation Hub
                        </strong>

                        <small th:if="${venue.description}"
                               th:text="${venue.description}">
                            Mô tả
                        </small>

                    </td>

                    <td>

                        <span th:text="${venue.ownerName}">
                            Host User
                        </span>

                        <small th:text="'ID: ' + ${venue.ownerId}">
                            ID: 2
                        </small>

                    </td>

                    <td>

                        <span th:text="${venue.address ?: '-'}">
                            Địa chỉ
                        </span>

                        <small th:if="${venue.city}"
                               th:text="${venue.city}">
                            Thành phố
                        </small>

                    </td>

                    <td>

                        <span class="venue-status-badge"
                              th:classappend="' status-' + ${#strings.toLowerCase(venue.status.name())}"
                              th:text="${venue.status}">
                            PENDING
                        </span>

                    </td>

                    <td>

                        <div class="venue-actions">

                            <form method="post"
                                  th:if="${venue.status.name() != 'APPROVE'}"
                                  th:action="@{/moderator/venues/{id}/status(id=${venue.id})}">

                                <input type="hidden"
                                       name="status"
                                       value="APPROVE">

                                <button class="venue-action-button venue-action-approve"
                                        type="submit"
                                        title="Duyệt venue">
                                    Duyệt
                                </button>

                            </form>


                            <form method="post"
                                  th:if="${venue.status.name() != 'BLOCKED'}"
                                  th:action="@{/moderator/venues/{id}/status(id=${venue.id})}">

                                <input type="hidden"
                                       name="status"
                                       value="BLOCKED">

                                <button class="venue-action-button venue-action-block"
                                        type="submit"
                                        title="Khóa venue">
                                    Khóa
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <div class="venue-empty"
             th:if="${venues.content.isEmpty()}">

            Không có venue phù hợp với bộ lọc.

        </div>


        <nav class="venue-pagination"
             aria-label="Phân trang"
             th:if="${venues.totalPages > 1}">

            <a th:if="${venues.pageNumber > 0}"
               th:href="@{/moderator/venues(
                   page=${venues.pageNumber - 1},
                   size=${venues.pageSize},
                   status=${selectedStatus}
               )}">
                Trang trước
            </a>


            <span th:text="'Trang ' + ${venues.pageNumber + 1} + ' / ' + ${venues.totalPages}">
                Trang 1 / 1
            </span>


            <a th:if="${!venues.last}"
               th:href="@{/moderator/venues(
                   page=${venues.pageNumber + 1},
                   size=${venues.pageSize},
                   status=${selectedStatus}
               )}">
                Trang sau
            </a>

        </nav>

    </div>

</section>

</html>
