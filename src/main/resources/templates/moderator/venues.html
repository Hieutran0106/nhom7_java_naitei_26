<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý venue</title>
    <link rel="stylesheet" th:href="@{/css/moderator-venues.css}">
</head>
<body>
<main>
    <header class="page-header">
        <div><h1>Quản lý venue</h1><p>Xem thông tin, duyệt venue đang chờ và khóa venue vi phạm.</p></div>
        <span class="total" th:text="${venues.totalElements} + ' venue'">0 venue</span>
    </header>
    <div class="alert success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <section class="card">
        <form class="filters" method="get" th:action="@{/moderator/venues}">
            <label for="status"><span>Trạng thái</span><select id="status" name="status">
                <option value="">Tất cả</option>
                <option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${item == selectedStatus}">PENDING</option>
            </select></label>
            <input type="hidden" name="size" th:value="${venues.pageSize}">
            <button class="filter-button" type="submit">Lọc danh sách</button>
        </form>
        <div class="table-wrap" th:if="${!venues.content.isEmpty()}">
            <table>
                <thead><tr><th>ID</th><th>Venue</th><th>Chủ sở hữu</th><th>Địa chỉ</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                <tbody><tr th:each="venue : ${venues.content}">
                    <td th:text="${venue.id}">1</td>
                    <td><strong th:text="${venue.name}">Innovation Hub</strong><small th:if="${venue.description}" th:text="${venue.description}">Mô tả</small></td>
                    <td><span th:text="${venue.ownerName}">Host User</span><small th:text="'ID: ' + ${venue.ownerId}">ID: 2</small></td>
                    <td><span th:text="${venue.address ?: '-'}">Địa chỉ</span><small th:if="${venue.city}" th:text="${venue.city}">Thành phố</small></td>
                    <td><span class="badge" th:classappend="' status-' + ${#strings.toLowerCase(venue.status.name())}" th:text="${venue.status}">PENDING</span></td>
                    <td><div class="actions">
                        <form method="post" th:if="${venue.status.name() != 'APPROVE'}" th:action="@{/moderator/venues/{id}/status(id=${venue.id})}">
                            <input type="hidden" name="status" value="APPROVE"><button class="approve" type="submit" title="Duyệt venue">Duyệt</button>
                        </form>
                        <form method="post" th:if="${venue.status.name() != 'BLOCKED'}" th:action="@{/moderator/venues/{id}/status(id=${venue.id})}">
                            <input type="hidden" name="status" value="BLOCKED"><button class="block" type="submit" title="Khóa venue">Khóa</button>
                        </form>
                    </div></td>
                </tr></tbody>
            </table>
        </div>
        <div class="empty" th:if="${venues.content.isEmpty()}">Không có venue phù hợp với bộ lọc.</div>
        <nav class="pagination" aria-label="Phân trang" th:if="${venues.totalPages > 1}">
            <a th:if="${venues.pageNumber > 0}" th:href="@{/moderator/venues(page=${venues.pageNumber - 1},size=${venues.pageSize},status=${selectedStatus})}">Trang trước</a>
            <span th:text="'Trang ' + ${venues.pageNumber + 1} + ' / ' + ${venues.totalPages}">Trang 1 / 1</span>
            <a th:if="${!venues.last}" th:href="@{/moderator/venues(page=${venues.pageNumber + 1},size=${venues.pageSize},status=${selectedStatus})}">Trang sau</a>
        </nav>
    </section>
</main>
</body>
</html>
