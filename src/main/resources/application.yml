spring:
  application:
    name: coworking-space
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # URL Supabase (Port 6543 for Transaction Pooler / bypass port blocking)
    url: jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
    username: postgres.iwiqpjhtzbsvnqczqnud
    # Không commit password lên Git – set biến môi trường DB_PASSWORD trên máy local
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: i18n/messages
    encoding: UTF-8

  # Set default language to Vietnamese (temporary setting)
  web:
    locale: vi
    locale-resolver: fixed

server:
  port: 8081 # Change to 8081 except port 8080

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    # Explicitly disabled: the Authorize token must not survive a page reload/browser
    # restart in localStorage, otherwise a stale token from a previous user can silently
    # get reused on /me after switching accounts.
    persist-authorization: false
  packages-to-scan: com.nhom7.coworkingspace.controller.api

# JWT
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 1 day
    refresh-expiration-ms: 604800000 # 7 days
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5} # 5 minutes
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60} # 60 seconds
    max-failed-attempts: ${OTP_MAX_FAILED_ATTEMPTS:5} # 5 attempts
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  cors:
    allowed-origins: http://localhost:3000, http://localhost:5173 # React (CRA) and Vite dev servers
  supabase:
    url: ${SUPABASE_URL:https://iwiqpjhtzbsvnqczqnud.supabase.co}
    key: ${SUPABASE_KEY:}
    bucket: ${SUPABASE_BUCKET:coworking-space}

logging:
  level:
    com.nhom7.coworkingspace: DEBUG
    org.springframework.security: INFO
